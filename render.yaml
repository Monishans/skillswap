# Optional Render Blueprint (New + > Blueprint). Manual setup steps are in README.md
services:
  - type: web
    name: skillswap-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: CLIENT_URL
        sync: false
      - key: MONGODB_URI
        sync: false
  - type: web
    name: skillswap-client
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
